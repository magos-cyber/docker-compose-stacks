# Loki Stack - Full log aggregation with Promtail and Grafana
# Usage: cd monitoring/grafana-loki && cp .env.example .env && docker compose up -d
#
# Services:
#   - loki       : log aggregator (3100)
#   - promtail   : log shipper, tails Docker & system logs (9080)
#   - grafana    : log dashboard with Loki datasource (3000)
#
# Web access:
#   Loki:   http://localhost:3100
#   Grafana: http://localhost:3000

version: "3.8"

services:
  loki:
    image: grafana/loki:latest
    container_name: grafana-loki-loki
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./config:/etc/loki
      - loki-data:/loki
    ports:
      - "${LOKI_PORT}:3100"
    networks:
      - loki-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  promtail:
    image: grafana/promtail:latest
    container_name: grafana-loki-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    environment:
      - TZ=${TZ}
      - HOSTNAME=${HOSTNAME:-localhost}
    volumes:
      - ./config/promtail:/etc/promtail
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - loki-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-loki-grafana
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANON_ENABLED}
      - GF_SERVER_HTTP_PORT=3000
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      - loki
    networks:
      - loki-net

volumes:
  loki-data:
    driver: local
  grafana-data:
    driver: local

networks:
  loki-net:
    name: loki-net
    driver: bridge