# GitLab CE Stack - GitLab Community Edition + CI/CD Runner
# Usage: cd cicd/gitlab && cp .env.example .env && docker compose up -d
#
# Services:
#   - gitlab        : GitLab CE (web UI, bundled Postgres/Redis/Sidekiq)
#   - gitlab-runner : shared CI/CD runner (docker executor)
#
# Web access:
#   HTTP  : http://localhost:8080   (redirects to HTTPS if configured)
#   HTTPS : https://localhost:8443
#   SSH   : localhost:2222
#
# First run: open the web UI, set the root password, then create a
# runner registration token under Admin -> CI/CD -> Runners and paste
# it into GITLAB_RUNNER_TOKEN in your .env (or run the runner container
# once: docker compose exec gitlab-runner gitlab-runner register).

version: "3.8"

services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    restart: unless-stopped
    hostname: ${GITLAB_HOSTNAME:-gitlab.local}
    environment:
      - TZ=${TZ}
      - GITLAB_OMNIBUS_CONFIG=${GITLAB_OMNIBUS_CONFIG}
    ports:
      - "${GITLAB_HTTP_PORT}:80"
      - "${GITLAB_HTTPS_PORT}:443"
      - "${GITLAB_SSH_PORT}:22"
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-data:/var/opt/gitlab
      - gitlab-logs:/var/log/gitlab
    shm_size: ${GITLAB_SHM_SIZE:-256m}
    healthcheck:
      test: ["CMD-SHELL", "/opt/gitlab/bin/gitlab-healthcheck --fail || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 10
      start_period: 300s
    networks:
      - gitlab-net

  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    container_name: gitlab-runner
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - CI_SERVER_URL=${GITLAB_EXTERNAL_URL}
      - REGISTRATION_TOKEN=${GITLAB_RUNNER_TOKEN}
      - RUNNER_NAME=${GITLAB_RUNNER_NAME:-gitlab-docker-runner}
      - RUNNER_EXECUTOR=docker
      - DOCKER_IMAGE=${GITLAB_RUNNER_DOCKER_IMAGE:-docker:24-dind}
      - DOCKER_VOLUMES=["/var/run/docker.sock:/var/run/docker.sock", "/cache"]
    volumes:
      - gitlab-runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
      - gitlab-runner-cache:/cache
    depends_on:
      - gitlab
    networks:
      - gitlab-net

volumes:
  gitlab-config:
    driver: local
  gitlab-data:
    driver: local
  gitlab-logs:
    driver: local
  gitlab-runner-config:
    driver: local
  gitlab-runner-cache:
    driver: local

networks:
  gitlab-net:
    name: gitlab-net
    driver: bridge